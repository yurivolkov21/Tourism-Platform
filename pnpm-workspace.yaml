packages:
  - 'apps/*'
  - 'libs/*'
  - 'packages/*'
  - 'libs/shared/*'
  - 'libs/web/*'
  - 'libs/mobile/ui'
# Transitive security pins (Dependabot). pnpm 11 reads `overrides` HERE, not
# package.json. Editing this alone may not re-resolve — also touch package.json
# or delete the lockfile. Remove an entry once the parent ships a patched range.
overrides:
  # One react across the workspace: Expo SDK 54 (apps/mobile in Expo Go) requires
  # exactly react 19.1.0; a second 19.2.7 resolution duplicates every RN peer
  # variant in .pnpm and breaks jest ("__fbBatchedBridgeConfig is not set").
  # Next 16 (web/admin) supports 19.1.0. react-dom/react-test-renderer must
  # match react's version exactly.
  react: '19.1.0'
  react-dom: '19.1.0'
  react-test-renderer: '19.1.0'
  postcss: '^8.5.10' # GHSA-qx2v-qp2m-jg93 (XSS in CSS stringify), patched 8.5.10
  '@hono/node-server': '^2.0.5' # GHSA serveStatic bypass (1.19.13) + path traversal
  # on Windows via encoded `%5C` (<2.0.5 — no 1.x backport). FORCED MAJOR: @prisma/dev
  # pins 1.19.11 and @modelcontextprotocol/sdk asks ^1.19.9, but both only load it for
  # `prisma dev` / the shadcn MCP server, neither of which this workspace runs.
  next: '>=16.2.11' # 21 advisories on Next.js 16 <16.2.11 (cache-poisoning/SSRF/DoS/middleware-bypass; last fix 16.2.11)
  uuid: '^11.1.1' # GHSA-w5hq-g745-h8pq (buffer bounds check in v3/v5/v6), patched 11.1.1
  tmp: '>=0.2.7' # GHSA-52f5-9888-34mv (path traversal), patched 0.2.7 — nx tooling
  form-data: '>=4.0.6' # GHSA-fjxv-7rqg-78g4 (CRLF injection), patched 4.0.6 — nx/axios
  js-yaml: '^4.3.0' # GHSA-h67p-54hq-rp68 + the merge-key-chain follow-up
  # (quadratic CPU via chained merge keys), patched 4.3.0. Blanket: the only <4.2 copy was 3.14.2 via
  # @istanbuljs/load-nyc-config (Jest/nyc coverage tooling), which calls only
  # js-yaml.load() — present & safe-by-default in 4.x — so forcing 4.2.0 removes
  # the 3.x copy without breaking it, and Dependabot #63 auto-closes.
  'undici@6': '^6.27.0' # GHSA Set-Cookie/header-injection/WS-DoS (<6.27.0) — dev tooling copy
  'undici@7': '^7.28.0' # +SOCKS5/TLS bypass (<7.28.0) — nx (@nx/module-federation) tooling copy
  'http-proxy-middleware': '^3.0.7' # GHSA field-injection/host-matching (<3.0.7) — next/webpack dev server (stay in 3.x; 4.x is breaking)
  multer: '^2.2.0' # GHSA DoS via nested field names (<2.2.0) — @nestjs/platform-express; stay in 2.x (minor bump)
  sharp: '^0.35.3' # GHSA inherited libvips CVE-2026-33327/33328/35590/35591 (<0.35.0),
  # no 0.34 backport. next@16.2 declares `sharp: ^0.34.5` as an OPTIONAL dep, but
  # next@canary already moved to ^0.35.3 — the forced bump follows upstream.
  tar: '>=7.5.21' # 5 GHSAs incl. CRITICAL unlimited-input decompression DoS (<=7.5.20) — @expo/cli
  'brace-expansion@1': '^1.1.16' # GHSA exponential-time expansion of consecutive `{}` groups
  'brace-expansion@2': '^2.1.2' # ^ same advisory, 2.x line
  'brace-expansion@5': '^5.0.7' # ^ same advisory, 5.x line
  axios: '^1.18.0' # GHSA proxy-after-clone + prototype-pollution set (<1.18.0) — nx tooling
  # AND @paypal/paypal-server-sdk (money path); @apimatic asks ^1.8.4, so this stays in range
  immutable: '^5.1.8' # GHSA hash-collision DoS + List 32-bit trie overflow (<5.1.8) — sass
  hono: '^4.12.27' # GHSA cx() JSX escaping bypass + cross-request context leak (<4.12.27) — prisma/mcp tooling
  valibot: '^1.4.2' # GHSA record() flatten() throws on inherited Object keys (<=1.4.1) — @prisma/dev
  webpack-dev-server: '^5.2.6' # GHSA malformed Host/Origin DoS + CSRF on dev endpoints (<=5.2.5) — @nx/webpack
  fast-uri: '^3.1.4' # GHSA host confusion via backslash authority + failed IDN canonicalization (<=3.1.3) — ajv
  'svgo@3': '^3.3.4' # GHSA removeScripts leaves some executable scripts intact — @svgr/plugin-svgo
  'svgo@4': '^4.0.2' # ^ same advisory, 4.x line — postcss-svgo
  'body-parser@2': '^2.3.0' # GHSA invalid `limit` silently disables size enforcement (<2.3.0) — express 5
  adm-zip: '^0.6.0' # GHSA crafted ZIP triggers 4GB allocation (<0.6.0). FORCED MAJOR:
  # @module-federation/dts-plugin pins 0.5.10 exactly, but module federation is unused here.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false # telemetry only — no build needed
  '@swc/core': true
  detox: true
  dtrace-provider: false
  esbuild: false # transitive only; prebuilt binary, no postinstall needed
  less: false
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@54.0.26'
  - '@expo/config-plugins@54.0.5'
  - '@expo/config@12.0.14'
  - '@expo/env@2.0.12'
  - '@expo/metro-config@54.0.17'
  - '@expo/prebuild-config@54.0.9'
  - '@expo/schema-utils@0.1.9'
  - babel-preset-expo@54.0.12
  - expo@54.0.36
